name: Build & Release Extension

on:
  push:
    branches:
      - ExtensityPlus-HaYTooL
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Extract Version from manifest.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected Extension Version: $VERSION"

      - name: Build Extension
        run: npm run build

      - name: Create WebStore ZIP Package
        id: create_zip
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ZIP_NAME="ExtensityPlus-HaYTooL-v${VERSION}-WebStore.zip"
          cd dist
          zip -r -9 "../${ZIP_NAME}" .
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.create_zip.outputs.ZIP_NAME }}
          path: ${{ steps.create_zip.outputs.ZIP_NAME }}
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.create_zip.outputs.ZIP_NAME }}
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: "Extensity+ HaYTooL ${{ steps.get_version.outputs.TAG }}"
          body: |
            ### 🚀 Extensity+ HaYTooL ${{ steps.get_version.outputs.TAG }}
            
            Tarayıcınıza yüklemek için aşağıdaki ZIP dosyasını indirip çıkartabilir ya da doğrudan mağazalara yükleyebilirsiniz.

            #### 📦 İndirilebilir Paketler:
            - **${{ steps.create_zip.outputs.ZIP_NAME }}**

            ---
            *Otomatik GitHub Actions tarafından derlenmiş ve yayınlanmıştır.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
